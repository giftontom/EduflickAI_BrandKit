<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Eduflick AI · App UI Kit</title>
<link rel="icon" type="image/svg+xml" href="../../assets/logo/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(91,91,240,0.14), transparent 60%),
      #07080C;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px;font-family:'Manrope',sans-serif;
  }
  #root{transform-origin:center}
</style>
</head>
<body>
<div id="root"></div>

<script>
  function fitDevice(){
    var r=document.getElementById('root');if(!r)return;
    var s=Math.min(1,(window.innerHeight-48)/874,(window.innerWidth-48)/402);
    r.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fitDevice);
  window.addEventListener('load',function(){setTimeout(fitDevice,50)});
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="../../assets/icons/sprite.js"></script>
<script type="text/babel" src="../ios-frame.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens-feed.jsx"></script>
<script type="text/babel" src="screens-more.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
