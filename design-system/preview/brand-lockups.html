<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .lab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .lk{border-radius:var(--radius-lg);height:96px;display:flex;align-items:center;justify-content:center;gap:11px;border:1px solid var(--line)}
  .l-indigoink{background:var(--i-ink)}
  .l-paper{background:var(--paper)}
  .l-indigo{background:var(--i-500)}
  .l-ink{background:var(--ink)}
  .lk svg{width:30px;height:30px}
  .wm{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-0.045em;line-height:1;display:inline-flex;align-items:baseline}
  .wm i{font-style:normal;margin-left:0.16em}
  .cap{font-family:var(--font-mono);font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:7px}
</style></head>
<body><div class="card-pad">
  <div class="lab">lockups · wordmark set in manrope 800 · "AI" carries the colour</div>
  <div class="grid">
    <div><div class="lk l-indigoink"><svg viewBox="0 0 180 180"><path d="M 13 13 L 167 13 L 167 82 L 120 112.5 L 167 143 L 167 167 L 13 167 Z" fill="#F5F2EA"/></svg><span class="wm" style="color:#F5F2EA">eduflick<i style="color:#8B97FF">AI</i></span></div><div class="cap">L.01 primary · indigo-ink</div></div>
    <div><div class="lk l-paper"><svg viewBox="0 0 180 180"><path d="M 13 13 L 167 13 L 167 82 L 120 112.5 L 167 143 L 167 167 L 13 167 Z" fill="#0B0822"/></svg><span class="wm" style="color:#0A0B10">eduflick<i style="color:#5B5BF0">AI</i></span></div><div class="cap">L.02 paper · light</div></div>
    <div><div class="lk l-indigo"><svg viewBox="0 0 180 180"><path d="M 13 13 L 167 13 L 167 82 L 120 112.5 L 167 143 L 167 167 L 13 167 Z" fill="#F5F2EA"/></svg><span class="wm" style="color:#F5F2EA">eduflick<i style="color:#F5F2EA">AI</i></span></div><div class="cap">L.03 indigo · brand</div></div>
    <div><div class="lk l-ink"><svg viewBox="0 0 180 180"><path d="M 13 13 L 167 13 L 167 82 L 120 112.5 L 167 143 L 167 167 L 13 167 Z" fill="#F5F2EA"/></svg><span class="wm" style="color:#F5F2EA">eduflick<i style="color:#F5F2EA;opacity:0.5">AI</i></span></div><div class="cap">L.04 mono · editorial</div></div>
  </div>
</div></body></html>
