<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .lab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .scale{display:flex;flex-direction:column;gap:9px}
  .r{display:grid;grid-template-columns:54px 46px 1fr;gap:14px;align-items:center}
  .t{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--paper);font-weight:500}
  .v{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.04em;color:var(--muted)}
  .bar{height:14px;background:var(--i-500);border-radius:3px}
</style></head>
<body><div class="card-pad">
  <div class="lab">spacing scale · 4px base unit</div>
  <div class="scale">
    <div class="r"><span class="t">1</span><span class="v">4px</span><div class="bar" style="width:4px"></div></div>
    <div class="r"><span class="t">2</span><span class="v">8px</span><div class="bar" style="width:8px"></div></div>
    <div class="r"><span class="t">3</span><span class="v">12px</span><div class="bar" style="width:12px"></div></div>
    <div class="r"><span class="t">4</span><span class="v">16px</span><div class="bar" style="width:16px"></div></div>
    <div class="r"><span class="t">6</span><span class="v">24px</span><div class="bar" style="width:24px"></div></div>
    <div class="r"><span class="t">8</span><span class="v">32px</span><div class="bar" style="width:32px"></div></div>
    <div class="r"><span class="t">12</span><span class="v">48px</span><div class="bar" style="width:48px"></div></div>
    <div class="r"><span class="t">16</span><span class="v">64px</span><div class="bar" style="width:64px"></div></div>
    <div class="r"><span class="t">24</span><span class="v">96px</span><div class="bar" style="width:96px"></div></div>
  </div>
</div></body></html>
