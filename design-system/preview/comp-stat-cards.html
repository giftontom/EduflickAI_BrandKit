<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .lab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .stat{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px}
  .sl{font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .sv{font-family:var(--font-display);font-weight:900;font-size:38px;letter-spacing:-0.03em;color:var(--paper);line-height:1}
  .sv em{font-family:var(--font-serif);font-style:italic;font-weight:400;color:var(--i-300);font-size:25px}
  .delta{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.04em;color:var(--success);margin-top:8px}
</style></head>
<body><div class="card-pad">
  <div class="lab">dashboard stat cards · educator surface</div>
  <div class="grid">
    <div class="stat"><div class="sl">active learners</div><div class="sv">2,847</div><div class="delta">↑ 340% YoY</div></div>
    <div class="stat"><div class="sl">flicks completed</div><div class="sv">12.4k</div><div class="delta">↑ daily</div></div>
    <div class="stat"><div class="sl">avg. retention</div><div class="sv">78<em>%</em></div><div class="delta">concepts retained</div></div>
  </div>
</div></body></html>
