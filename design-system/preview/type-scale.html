<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .row{display:grid;grid-template-columns:88px 1fr;gap:22px;align-items:baseline;padding:15px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:none}
  .row:first-child{padding-top:2px}
  .tag{font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);line-height:1.6}
  .tag b{display:block;color:var(--i-300);font-size:9.5px}
  .s-h1{font-family:var(--font-display);font-weight:900;font-size:46px;letter-spacing:-0.055em;line-height:0.9;text-transform:lowercase;color:var(--paper)}
  .s-h2{font-family:var(--font-display);font-weight:800;font-size:32px;letter-spacing:-0.03em;line-height:1.05;text-transform:lowercase;color:var(--paper)}
  .s-h3{font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:-0.025em;color:var(--paper)}
  .s-h4{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-0.02em;color:var(--paper)}
  em{font-family:var(--font-serif);font-style:italic;font-weight:400;color:var(--i-300)}
</style></head>
<body><div class="card-pad-lg">
  <div class="row"><div class="tag"><b>H1</b>900 · 64px</div><div class="s-h1">a feed for <em>thinking.</em></div></div>
  <div class="row"><div class="tag"><b>H2</b>800 · 40px</div><div class="s-h2">the flick is the <em>unit.</em></div></div>
  <div class="row"><div class="tag"><b>H3</b>800 · 28px</div><div class="s-h3">one shape, one notch.</div></div>
  <div class="row"><div class="tag"><b>H4</b>800 · 22px</div><div class="s-h4">brevity is respect.</div></div>
</div></body></html>
