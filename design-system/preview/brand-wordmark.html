<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .lab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .stage{display:flex;align-items:baseline;justify-content:center;padding:14px 0 22px}
  .wm{font-family:var(--font-display);font-weight:800;font-size:64px;letter-spacing:-0.045em;line-height:1;color:var(--paper)}
  .wm .ai{color:var(--i-300);margin-left:14px}
  .specs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;border-top:1px dashed var(--line);padding-top:18px}
  .specs div{font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;color:var(--paper-dim);line-height:1.6}
  .specs b{display:block;color:var(--paper);font-weight:500;letter-spacing:0.16em;text-transform:uppercase;font-size:9px;margin-bottom:4px}
</style></head>
<body><div class="card-pad">
  <div class="lab">wordmark · anatomy</div>
  <div class="stage"><span class="wm">eduflick<span class="ai">AI</span></span></div>
  <div class="specs">
    <div><b>typeface</b>Manrope 800</div>
    <div><b>tracking</b>−0.045em</div>
    <div><b>gap</b>0.16 cap-height</div>
    <div><b>case</b>lowercase + AI caps</div>
  </div>
</div></body></html>
