<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .lab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
  .ic{background:var(--ink-2);aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--paper)}
  .ic svg{width:21px;height:21px}
  .note{margin-top:13px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.04em;color:var(--paper-dim);line-height:1.6}
</style><script src="_sprite.js"></script>
</head>
<body><div class="card-pad">
  <div class="lab">iconography · 24-icon house set · 2px stroke · lucide-class</div>
  <div class="grid">
    <div class="ic"><svg><use href="#ic-book"/></svg></div>
    <div class="ic"><svg><use href="#ic-play"/></svg></div>
    <div class="ic"><svg><use href="#ic-clock"/></svg></div>
    <div class="ic"><svg><use href="#ic-search"/></svg></div>
    <div class="ic"><svg><use href="#ic-star"/></svg></div>
    <div class="ic"><svg><use href="#ic-heart"/></svg></div>
    <div class="ic"><svg><use href="#ic-share"/></svg></div>
    <div class="ic"><svg><use href="#ic-download"/></svg></div>
    <div class="ic"><svg><use href="#ic-settings"/></svg></div>
    <div class="ic"><svg><use href="#ic-user"/></svg></div>
    <div class="ic"><svg><use href="#ic-bell"/></svg></div>
    <div class="ic"><svg><use href="#ic-check"/></svg></div>
    <div class="ic"><svg><use href="#ic-plus"/></svg></div>
    <div class="ic"><svg><use href="#ic-arrow-right"/></svg></div>
    <div class="ic"><svg><use href="#ic-arrow-up"/></svg></div>
    <div class="ic"><svg><use href="#ic-menu"/></svg></div>
    <div class="ic"><svg><use href="#ic-grid"/></svg></div>
    <div class="ic"><svg><use href="#ic-lock"/></svg></div>
    <div class="ic"><svg><use href="#ic-mail"/></svg></div>
    <div class="ic"><svg><use href="#ic-map-pin"/></svg></div>
    <div class="ic"><svg><use href="#ic-link"/></svg></div>
    <div class="ic"><svg><use href="#ic-film"/></svg></div>
    <div class="ic"><svg><use href="#ic-pencil"/></svg></div>
    <div class="ic"><svg><use href="#ic-trash"/></svg></div>
  </div>
  <div class="note">Extra icons pull from Lucide — same 2px round style, no visible seam.</div>
</div></body></html>
