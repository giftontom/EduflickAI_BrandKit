<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .ramp{display:grid;grid-template-columns:repeat(11,1fr);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line)}
  .sw{aspect-ratio:1/1.5;padding:10px 8px;display:flex;flex-direction:column;justify-content:flex-end;font-family:var(--font-mono);font-size:8.5px;line-height:1.35;letter-spacing:0.02em}
  .sw .n{font-weight:500;opacity:0.9}
  .sw .h{opacity:0.7;font-size:8px}
  .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .head .t{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-0.025em;text-transform:lowercase}
  .head .t em{font-family:var(--font-serif);font-style:italic;font-weight:400;color:var(--i-300)}
  .note{margin-top:13px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;color:var(--paper-dim);line-height:1.6}
  .note b{color:var(--paper);font-weight:500}
</style></head>
<body><div class="card-pad">
  <div class="head"><div class="t">indigo <em>· primary</em></div><div class="k">the only brand hue</div></div>
  <div class="ramp">
    <div class="sw" style="background:#EEF0FF;color:#0B0822"><span class="n">50</span><span class="h">#EEF0FF</span></div>
    <div class="sw" style="background:#DCE0FF;color:#0B0822"><span class="n">100</span><span class="h">#DCE0FF</span></div>
    <div class="sw" style="background:#B7C0FF;color:#0B0822"><span class="n">200</span><span class="h">#B7C0FF</span></div>
    <div class="sw" style="background:#8B97FF;color:#0B0822"><span class="n">300</span><span class="h">#8B97FF</span></div>
    <div class="sw" style="background:#6E78F5;color:#fff"><span class="n">400</span><span class="h">#6E78F5</span></div>
    <div class="sw" style="background:#5B5BF0;color:#fff"><span class="n">500</span><span class="h">#5B5BF0</span></div>
    <div class="sw" style="background:#4B3FE0;color:#fff"><span class="n">600</span><span class="h">#4B3FE0</span></div>
    <div class="sw" style="background:#3A2BB8;color:#F5F2EA"><span class="n">700</span><span class="h">#3A2BB8</span></div>
    <div class="sw" style="background:#261A82;color:#F5F2EA"><span class="n">800</span><span class="h">#261A82</span></div>
    <div class="sw" style="background:#150D52;color:#F5F2EA"><span class="n">900</span><span class="h">#150D52</span></div>
    <div class="sw" style="background:#0B0822;color:#B7C0FF"><span class="n">ink</span><span class="h">#0B0822</span></div>
  </div>
  <div class="note"><b>500</b> is primary — buttons, the mark, the "AI" accent uses <b>300</b>. <b>700–ink</b> for hero canvases &amp; gradient depth. <b>50–200</b> for hovers &amp; soft washes.</div>
</div></body></html>
