<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .lab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .tier{display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center}
  .stage{width:100%;aspect-ratio:1;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center}
  .stage svg{width:34px;height:34px;color:var(--paper)}
  .t-flicker{background:radial-gradient(circle,rgba(91,91,240,0.16) 0%,var(--i-ink) 70%)}
  .t-ember{background:radial-gradient(circle,rgba(91,91,240,0.28) 0%,var(--i-ink) 70%)}
  .t-flame{background:radial-gradient(circle,rgba(91,91,240,0.42) 0%,var(--i-ink) 70%)}
  .t-blaze{background:radial-gradient(circle,rgba(91,91,240,0.58) 0%,var(--i-ink) 70%)}
  .t-legend{background:radial-gradient(circle,rgba(183,192,255,0.5) 0%,rgba(91,91,240,0.6) 40%,var(--i-ink) 80%);box-shadow:inset 0 0 0 1px rgba(183,192,255,0.3)}
  .nm{font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:-0.02em;color:var(--paper);text-transform:lowercase}
  .ds{font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.04em;color:var(--paper-dim);line-height:1.5}
</style></head>
<body><div class="card-pad">
  <div class="lab">sparks · gamification · the mark is the trophy · earned, never bought</div>
  <div class="tiers">
    <div class="tier"><div class="stage t-flicker"><svg viewBox="0 0 180 180"><path d="M 13 13 L 167 13 L 167 82 L 120 112.5 L 167 143 L 167 167 L 13 167 Z" fill="currentColor"/></svg></div><div><div class="nm">flicker</div><div class="ds">1st flick</div></div></div>
    <div class="tier"><div class="stage t-ember"><svg viewBox="0 0 180 180"><path d="M 13 13 L 167 13 L 167 82 L 120 112.5 L 167 143 L 167 167 L 13 167 Z" fill="currentColor"/></svg></div><div><div class="nm">ember</div><div class="ds">7-day streak</div></div></div>
    <div class="tier"><div class="stage t-flame"><svg viewBox="0 0 180 180"><path d="M 13 13 L 167 13 L 167 82 L 120 112.5 L 167 143 L 167 167 L 13 167 Z" fill="currentColor"/></svg></div><div><div class="nm">flame</div><div class="ds">30-day streak</div></div></div>
    <div class="tier"><div class="stage t-blaze"><svg viewBox="0 0 180 180"><path d="M 13 13 L 167 13 L 167 82 L 120 112.5 L 167 143 L 167 167 L 13 167 Z" fill="currentColor"/></svg></div><div><div class="nm">blaze</div><div class="ds">100-day streak</div></div></div>
    <div class="tier"><div class="stage t-legend"><svg viewBox="0 0 180 180"><path d="M 13 13 L 167 13 L 167 82 L 120 112.5 L 167 143 L 167 167 L 13 167 Z" fill="currentColor"/></svg></div><div><div class="nm">legend</div><div class="ds">365-day streak</div></div></div>
  </div>
</div></body></html>
