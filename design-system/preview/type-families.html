<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
  .fam{background:var(--ink-2);padding:22px 20px}
  .spec{font-size:54px;line-height:1;color:var(--paper);margin-bottom:16px}
  .f-manrope{font-family:var(--font-display);font-weight:900;letter-spacing:-0.04em}
  .f-serif{font-family:var(--font-serif);font-style:italic;font-weight:400;color:var(--i-300)}
  .f-mono{font-family:var(--font-mono);font-weight:500;font-size:44px;letter-spacing:-0.01em}
  .nm{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:-0.02em;color:var(--paper);margin-bottom:4px}
  .meta{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.06em;color:var(--muted);line-height:1.6}
  .role{font-family:var(--font-mono);font-size:9px;letter-spacing:0.04em;color:var(--paper-dim);margin-top:8px;line-height:1.5}
</style></head>
<body><div class="card-pad">
  <div class="grid">
    <div class="fam"><div class="spec f-manrope">Aa</div><div class="nm">Manrope</div><div class="meta">400 · 500 · 600 · 700 · 800 · 900</div><div class="role">display, headings, UI, body</div></div>
    <div class="fam"><div class="spec f-serif">Aa</div><div class="nm">Instrument Serif</div><div class="meta">italic only</div><div class="role">editorial accent words</div></div>
    <div class="fam"><div class="spec f-mono">Aa</div><div class="nm">JetBrains Mono</div><div class="meta">400 · 500</div><div class="role">labels, meta, numbers, code</div></div>
  </div>
</div></body></html>
