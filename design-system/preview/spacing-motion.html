<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .lab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .ec{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 16px 14px}
  .ec .track{height:8px;border-radius:999px;background:var(--ink);position:relative;overflow:hidden;margin-bottom:14px}
  .ec .dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--i-500);transform:translateY(-50%);left:6px}
  .nm{font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:-0.02em;color:var(--paper);text-transform:lowercase}
  .code{font-family:var(--font-mono);font-size:9px;letter-spacing:0.02em;color:var(--i-300);margin-top:4px;line-height:1.5}
  .desc{font-family:var(--font-mono);font-size:9px;letter-spacing:0.03em;color:var(--paper-dim);margin-top:6px;line-height:1.5}
  @keyframes slide-out{0%,12%{left:6px}88%,100%{left:calc(100% - 20px)}}
  @keyframes slide-io{0%,12%{left:6px}50%{left:calc(100% - 20px)}88%,100%{left:6px}}
  @keyframes slide-spring{0%,12%{left:6px}60%{left:calc(100% - 14px)}74%{left:calc(100% - 24px)}88%,100%{left:calc(100% - 20px)}}
  .d1{animation:slide-out 2.4s var(--ease-out) infinite}
  .d2{animation:slide-io 2.4s var(--ease-in-out) infinite}
  .d3{animation:slide-spring 2.4s var(--ease-spring) infinite}
</style></head>
<body><div class="card-pad">
  <div class="lab">motion · purposeful &amp; quick · fast 150 · base 300 · slow 600</div>
  <div class="grid">
    <div class="ec"><div class="track"><div class="dot d1"></div></div><div class="nm">ease-out</div><div class="code">cubic-bezier(.16,1,.3,1)</div><div class="desc">default — enters, reveals</div></div>
    <div class="ec"><div class="track"><div class="dot d2"></div></div><div class="nm">ease-in-out</div><div class="code">cubic-bezier(.7,0,.2,1)</div><div class="desc">the notch carve, transitions</div></div>
    <div class="ec"><div class="track"><div class="dot d3"></div></div><div class="nm">spring</div><div class="code">cubic-bezier(.34,1.56,.64,1)</div><div class="desc">earning a spark — then quiet</div></div>
  </div>
</div></body></html>
