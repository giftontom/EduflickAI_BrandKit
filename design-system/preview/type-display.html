<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .lab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .big{font-family:var(--font-display);font-weight:900;font-size:74px;letter-spacing:-0.05em;line-height:0.88;text-transform:lowercase;color:var(--paper)}
  .big em{font-family:var(--font-serif);font-style:italic;font-weight:400;color:var(--i-300)}
  .specs{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
  .specs div{font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;color:var(--paper-dim);line-height:1.6}
  .specs b{display:block;color:var(--paper);font-weight:500;letter-spacing:0.18em;text-transform:uppercase;font-size:9px;margin-bottom:4px}
</style></head>
<body><div class="card-pad-lg">
  <div class="lab">display · manrope 900</div>
  <div class="big">learn anything <em>in sixty seconds.</em></div>
  <div class="specs">
    <div><b>family</b>Manrope</div>
    <div><b>weight</b>900</div>
    <div><b>tracking</b>−0.05em</div>
    <div><b>leading</b>0.9</div>
    <div><b>case</b>lowercase always</div>
    <div><b>accent</b>Instrument Serif italic</div>
  </div>
</div></body></html>
