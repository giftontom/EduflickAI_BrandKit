<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  .lab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:100%;aspect-ratio:1;background:rgba(91,91,240,0.12);border:1px solid var(--i-500);border-bottom-width:0;border-right-width:0;}
  .nm{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--paper);font-weight:500}
  .px{font-family:var(--font-mono);font-size:9px;letter-spacing:0.04em;color:var(--muted)}
</style></head>
<body><div class="card-pad">
  <div class="lab">radius tokens · sharp cards, soft canvases</div>
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="nm">sm</div><div class="px">6px</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="nm">md</div><div class="px">10px</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="nm">lg</div><div class="px">14px</div></div>
    <div class="item"><div class="box" style="border-radius:18px"></div><div class="nm">xl</div><div class="px">18px</div></div>
    <div class="item"><div class="box" style="border-radius:22px"></div><div class="nm">2xl</div><div class="px">22px</div></div>
    <div class="item"><div class="box" style="border-radius:28px"></div><div class="nm">3xl</div><div class="px">28px</div></div>
  </div>
</div></body></html>
