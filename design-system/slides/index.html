<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../assets/logo/favicon.svg">
<title>Eduflick AI · Presentation slides</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#07080C;color:#F5F2EA;font-family:'Manrope',sans-serif;padding:40px 32px 64px;
    background-image:radial-gradient(900px 600px at 50% -10%, rgba(91,91,240,0.12), transparent 60%)}
  .head{max-width:1000px;margin:0 auto 28px;display:flex;align-items:center;gap:12px}
  .head .wm{font-weight:800;font-size:20px;letter-spacing:-0.045em}
  .head .wm i{font-style:normal;color:#8B97FF}
  .head .tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#7A7F90;margin-left:auto}
  .grid{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .slide{border-radius:14px;overflow:hidden;border:1px solid rgba(245,242,234,0.1);box-shadow:0 16px 48px rgba(0,0,0,0.5);position:relative;aspect-ratio:16/9}
  .slide iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .cap{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#7A7F90;margin:0 2px 8px}
</style></head>
<body>
  <div class="head">
    <svg viewBox="0 0 180 180" width="26" height="26"><path d="M 13 13 L 167 13 L 167 82 L 120 112.5 L 167 143 L 167 167 L 13 167 Z" fill="#5B5BF0"/></svg>
    <span class="wm">eduflick<i>AI</i></span>
    <span class="tag">presentation · master slides</span>
  </div>
  <div class="grid">
    <div><div class="cap">01 · title</div><div class="slide"><iframe src="TitleSlide.html" loading="lazy"></iframe></div></div>
    <div><div class="cap">02 · section divider</div><div class="slide"><iframe src="SectionSlide.html" loading="lazy"></iframe></div></div>
    <div><div class="cap">03 · content · metrics</div><div class="slide"><iframe src="ContentSlide.html" loading="lazy"></iframe></div></div>
    <div><div class="cap">04 · editorial quote</div><div class="slide"><iframe src="QuoteSlide.html" loading="lazy"></iframe></div></div>
    <div><div class="cap">05 · closing</div><div class="slide"><iframe src="ClosingSlide.html" loading="lazy"></iframe></div></div>
  </div>
</body></html>
