name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Markdown & Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          # Rules come from the committed .markdownlint.json (auto-discovered),
          # so local `make format` and CI share one config.
          globs: "**/*.md"

      - name: Check internal links
        run: |
          # Verify all Markdown-internal cross-references resolve
          broken=0
          for f in $(find . -name "*.md" -not -path "./.git/*" -not -path "./tools/node_modules/*" -not -path "./_archive/*"); do
            # Extract relative links like [text](path.md) and [text](../path/file.md)
            links=$(grep -oP '\[[^\]]*\]\(\.\.?/[^)]+\.md[^)]*\)' "$f" | grep -oP '(?<=\().*?(?=\))' || true)
            for link in $links; do
              # Remove anchors
              target="${link%%#*}"
              resolved=$(realpath --relative-to="$(pwd)" "$(dirname "$f")/$target" 2>/dev/null || echo "")
              if [ -z "$resolved" ] || [ ! -f "$resolved" ]; then
                echo "✗ Broken: $f → $link"
                broken=1
              fi
            done
          done
          if [ $broken -eq 1 ]; then
            echo "::error::Broken internal links found"
            exit 1
          fi
          echo "✓ All internal links resolve"

  html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML files
        run: |
          # Basic HTML structure validation — every shipped artifact, not a fixed list
          broken=0
          for f in \
            index.html \
            brand-book/*.html \
            brochures/*.html \
            design-system/collateral/*.html \
            design-system/slides/index.html; do
            if [ ! -f "$f" ]; then
              echo "⚠ Missing (skipped): $f"
              continue
            fi
            # Check for unclosed html/head/body tags
            if grep -q '<html' "$f" && ! grep -q '</html>' "$f"; then
              echo "✗ Unclosed <html> in: $f"
              broken=1
            fi
            if grep -q '<body' "$f" && ! grep -q '</body>' "$f"; then
              echo "✗ Unclosed <body> in: $f"
              broken=1
            fi
            echo "  ✓ $f"
          done
          if [ $broken -eq 1 ]; then
            echo "::error::HTML validation failed"
            exit 1
          fi
          echo "✓ HTML validation passed"

  tools:
    name: Verify Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: cd tools && npm ci
        continue-on-error: true  # Playwright install may need system deps

      - name: Check package.json syntax
        run: node -e "JSON.parse(require('fs').readFileSync('tools/package.json','utf8')); console.log('✓ package.json valid')"

      - name: Check script syntax (all tools)
        run: |
          for f in tools/*.mjs; do
            node --check "$f" || exit 1
          done
          echo "✓ All tools parse"

      - name: Assets mirror in sync
        run: |
          # Root assets/ is the documented public mirror of design-system/assets/
          # (minus design-system-only icons/). Fail if the mirrored trees drift.
          drift=0
          cd assets
          # READMEs are per-tree docs, not mirrored assets
          for f in $(find . -type f -not -name '.DS_Store' -not -name '*.md'); do
            if [ ! -f "../design-system/assets/$f" ]; then
              echo "✗ In assets/ but not canonical: $f"; drift=1
            elif ! cmp -s "$f" "../design-system/assets/$f"; then
              echo "✗ Mirror drift: $f"; drift=1
            fi
          done
          if [ $drift -eq 1 ]; then
            echo "::error::assets/ mirror has drifted from design-system/assets/ — sync it"
            exit 1
          fi
          echo "✓ assets/ mirror matches design-system/assets/"

  generated:
    name: Tokens & snippets drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install tool deps (no Chromium needed)
        run: cd tools && npm ci --ignore-scripts

      - name: Regenerate tokens + snippets from source
        run: |
          cd tools
          npm run tokens
          npm run snippets

      - name: Fail if generated files are out of date
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files drifted from source. Run 'cd tools && npm run tokens && npm run snippets' and commit."
            git --no-pager diff --stat
            exit 1
          fi
          echo "✓ tokens.css, tokens.flat.json, brand.tokens.mjs, snippets.md all in sync with source"

  facts:
    name: Facts integrity (no retired brand strings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check for retired brand strings
        run: node tools/check-facts.mjs
